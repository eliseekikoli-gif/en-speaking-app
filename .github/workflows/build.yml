name: Build En-Speaking APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.2'

    - name: Safe Scaffold & Build APK
      run: |
        cp lib/main.dart /tmp/main.dart.bak
        cp pubspec.yaml /tmp/pubspec.yaml.bak
        rm -rf android
        flutter create --org com.enspeaking --project-name enspeaking --platforms=android .
        cp /tmp/main.dart.bak lib/main.dart
        cp /tmp/pubspec.yaml.bak pubspec.yaml
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EnSpeaking-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
