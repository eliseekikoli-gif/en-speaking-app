name: Build En-Speaking APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.2'

    - name: Initialize Android Scaffolding & Compile
      run: |
        mkdir -p /tmp/save
        cp -f lib/main.dart /tmp/save/main.dart
        cp -f pubspec.yaml /tmp/save/pubspec.yaml
        rm -rf android .dart_tool
        flutter create --org com.enspeaking --project-name enspeaking --platforms=android --no-pub .
        cp -f /tmp/save/main.dart lib/main.dart
        cp -f /tmp/save/pubspec.yaml pubspec.yaml
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    - name: Upload En-Speaking APK
      uses: actions/upload-artifact@v4
      with:
        name: EnSpeaking-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
